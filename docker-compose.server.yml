services:
  tampermonkey-dev:
    build:
      context: .
    container_name: uweb-tampermonkey-dev-server
    working_dir: /app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_SCHEME: https
      LETSENCRYPT_SITE: ${LETSENCRYPT_SITE}
      LETSENCRYPT_ROOT: /etc/letsencrypt/live
    ports:
      - "8123:8123"
    volumes:
      - .:/app
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    command: npm run dev:server
